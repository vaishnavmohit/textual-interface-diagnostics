[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textual-interface-diagnostics"
version = "1.0.0"
description = "Perception-reasoning interface experiments on multi-image visual reasoning benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mohit Vaishnav" },
    { name = "Tanel Tammet" },
]
keywords = ["multimodal-models", "visual-reasoning", "bongard", "winoground", "evaluation"]
dependencies = [
    "openai>=1.50",
    "mistralai>=1.2,<2",
    "google-genai>=1.0",
    "ollama>=0.4.4",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "Pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
