# C2r stage 1 -- the relational schema variant on Bongard-HOI soua.
#
# The C2 schema's Activities field is a bare JSON list, and on this split the
# concept's defining action is named in only 61.3% of positive images and 19.8%
# of negatives. This variant adds ONE field asking for each agent-object pair
# explicitly (action, contact, role) and changes nothing else. It stays
# task-blind: no mention of the task, the rule, the categories, or the image's
# role, so C2r - C2 isolates schema elicitation rather than task knowledge.
#
#   python main.py --config config/bongard_hoi/describe_ca_relational_gemini3_soua.yaml
model:
  module: "pri.describe"
  function: "run"
  parameters:
    dataset: "bongard_hoi"
    json_path: "${DATA_DIR}/bongard_hoi/bongard_hoi_test_seen_obj_unseen_act.json"
    image_dir: "${DATA_DIR}/hake"
    perception_model: "gemini-3-flash-preview"   # the model where CA costs 4.9 points
    context: "ca_relational"
    output_dir: "${OUTPUT_DIR}"
    split_name: "bongard_hoi_soua"
    num_samples: 200            # powered to resolve ~5 points; see docs/EXP_SCHEMA_ELICITATION.md
    m: 6
    n: 6
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
    force: false
