# CA stage 2 -- reason over the frozen gemini-3.5-flash-lite descriptions.
# Describer and reasoner are the same model, as in the existing grid cells.
#
# Requires the matching describe run to have finished with counts.failed == 0;
# pipeline.run aborts if the frozen artifact is missing, by design.
#
#   python main.py --config config/bongard_hoi/reason_ca_gemini35lite_soua.yaml
model:
  module: "pri.pipeline"
  function: "run"
  parameters:
    dataset: "bongard_hoi"
    json_path: "${DATA_DIR}/bongard_hoi/bongard_hoi_test_seen_obj_unseen_act.json"
    image_dir: "${DATA_DIR}/hake"
    reasoner_model: "gemini-3.5-flash-lite"
    perception_model: "gemini-3.5-flash-lite"
    context: "ca"
    output_dir: "${OUTPUT_DIR}"
    experiment: "bongard_hoi_soua_ca"
    split_name: "bongard_hoi_soua"
    num_samples: 500
    m: 6
    n: 6
    temperature: 0
    max_tokens: 2048
    num_ctx: 8192
    think: false
