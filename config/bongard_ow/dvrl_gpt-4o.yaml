# DVRL (end-to-end): GPT-4o sees all 13 images in one pass and classifies the query.
# No describe stage. Only models that ingest 13 images can run this.
#   python main.py --config config/bongard_ow/dvrl_gpt-4o.yaml
model:
  module: "pri.endtoend"
  function: "run"
  parameters:
    dataset: "bongard_ow"
    json_path: "${DATA_DIR}/bongard_ow/rearranged_bongard.json"
    image_dir: "${DATA_DIR}/bongard_ow"
    model: "gpt-4o"
    context: "dvrl"
    output_dir: "${OUTPUT_DIR}"
    experiment: "bongard_ow"
    split_name: "bongard_ow"
    num_samples: 5
    m: 6
    n: 6
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
