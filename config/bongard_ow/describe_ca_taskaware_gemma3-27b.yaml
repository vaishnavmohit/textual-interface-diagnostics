# E2 perception condition 'ca_taskaware' — Gemma3-27B describes each Bongard-OW image.
# Distinct schema_version so it never mixes with the task-blind CA artifact.
#   ca_taskaware = C3 (task-aware structured)
# Then reason with a copy of reason_ca_*.yaml whose context is set to 'ca_taskaware'.
model:
  module: "pri.describe"
  function: "run"
  parameters:
    dataset: "bongard_ow"
    json_path: "${DATA_DIR}/bongard_ow/rearranged_bongard.json"
    image_dir: "${DATA_DIR}/bongard_ow"
    perception_model: "gemma3:27b"
    context: "ca_taskaware"
    output_dir: "${OUTPUT_DIR}"
    split_name: "bongard_ow"
    num_samples: 500
    m: 6
    n: 6
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
    force: false
