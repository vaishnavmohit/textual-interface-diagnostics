# C3 stage 1 (perception): gpt-4o describes each Bongard-OW image.
# task-aware structured: byte-identical C2 schema + a task block.
# Immutable hashed artifact under ${OUTPUT_DIR}/descriptions/gpt-4o/...
# Run ONCE per (perception model, context, split); reasoners then reuse it.
#   python main.py --config config/bongard_ow/describe_ca_taskaware_gpt-4o.yaml
model:
  module: "pri.describe"
  function: "run"
  parameters:
    dataset: "bongard_ow"
    json_path: "${DATA_DIR}/bongard_ow/rearranged_bongard.json"
    image_dir: "${DATA_DIR}/bongard_ow"
    perception_model: "gpt-4o-2024-08-06"
    context: "ca_taskaware"
    output_dir: "${OUTPUT_DIR}"
    split_name: "bongard_ow"
    num_samples: 500                      # full split (--set num_samples=5 for a smoke run)
    # C2 (the task-blind arm) was generated at temperature 1.0 with this
    # pinned snapshot; C3 must match, so the task block is the only difference.
    m: 6
    n: 6
    temperature: 1.0
    max_tokens: 3000
    num_ctx: 8192
    think: false
    force: false
