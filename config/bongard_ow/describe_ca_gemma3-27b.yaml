# Stage 1 (perception): Gemma3-27B describes each Bongard-OW image, task-blind.
# Writes the immutable, hashed artifact under ${OUTPUT_DIR}/descriptions/... .
# Run this ONCE per (perception model, split); reasoners then reuse it.
#   python main.py --config config/bongard_ow/describe_ca_gemma3-27b.yaml
model:
  module: "pri.describe"
  function: "run"
  parameters:
    dataset: "bongard_ow"
    json_path: "${DATA_DIR}/bongard_ow/rearranged_bongard.json"
    image_dir: "${DATA_DIR}/bongard_ow"
    perception_model: "gemma3:27b"
    context: "ca"
    output_dir: "${OUTPUT_DIR}"
    split_name: "bongard_ow"
    num_samples: 500          # full split (--set num_samples=5 for a smoke run)
    m: 6
    n: 6
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
    force: false
