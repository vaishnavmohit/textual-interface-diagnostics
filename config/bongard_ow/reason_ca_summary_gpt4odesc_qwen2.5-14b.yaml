# Summary-only reasoning: the reasoner reads ONLY the Summary field of each
# structured description (prose, ~11% of the full artifact), produced by the same
# perceptual pass. Derive the artifact first:
#
#   python scripts/derive_summary_descriptions.py --out $OUTPUT_DIR \
#       --model-name gpt-4o-2024-08-06 --split bongard_ow
#
# CA (full) - summary isolates how much of the structured detail the reasoner
# actually uses. It does NOT isolate structure: the summary was written after the
# describer had decomposed the scene, so it distils structured attention rather
# than replacing it. The unstructured-perception condition is context ca_flat.
#
#   python main.py --config config/bongard_ow/reason_ca_summary_gpt4odesc_qwen2.5-14b.yaml
model:
  module: "pri.pipeline"
  function: "run"
  parameters:
    reasoner_model: "qwen2.5:14b"
    dataset: "bongard_ow"
    json_path: "${DATA_DIR}/bongard_ow/rearranged_bongard.json"
    image_dir: "${DATA_DIR}/bongard_ow"
    perception_model: "gpt-4o-2024-08-06"
    context: "ca_summary"
    output_dir: "${OUTPUT_DIR}"
    experiment: "bongard_ow_summary"
    split_name: "bongard_ow"
    num_samples: 500
    m: 6
    n: 6
    temperature: 0
    max_tokens: 2048
    num_ctx: 16384
    think: false
