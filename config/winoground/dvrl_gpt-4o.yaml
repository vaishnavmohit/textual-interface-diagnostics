# Winoground DVRL (direct): GPT-4o scores Text/Image/Group over the images
# directly (no describe stage).
#   python main.py --config config/winoground/dvrl_gpt-4o.yaml
model:
  module: "pri.winoground"
  function: "run_direct"
  parameters:
    dataset: "winoground"
    json_path: "${DATA_DIR}/winoground/winoground.json"
    image_dir: "${DATA_DIR}/winoground/images"
    model: "gpt-4o"
    output_dir: "${OUTPUT_DIR}"
    experiment: "winoground"
    split_name: "winoground"
    num_samples: 5
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
