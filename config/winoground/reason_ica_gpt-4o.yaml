# Winoground ICA (interactive): CA + one reasoner-generated question per
# direction, answered by re-inspecting the real image, then a final decision.
# Requires the describe run (context=winoground) first. reinspection_model
# defaults to perception_model; set it explicitly to vary who re-inspects.
#   python main.py --config config/winoground/reason_ica_gpt-4o.yaml
model:
  module: "pri.winoground"
  function: "run_interactive"
  parameters:
    dataset: "winoground"
    json_path: "${DATA_DIR}/winoground/winoground.json"
    image_dir: "${DATA_DIR}/winoground/images"
    reasoner_model: "gpt-4o"
    perception_model: "gpt-4o"       # whose frozen descriptions to reason over
    reinspection_model: "gpt-4o"     # who re-inspects the real image on a query
    output_dir: "${OUTPUT_DIR}"
    experiment: "winoground"
    split_name: "winoground"
    num_samples: 400                   # full Winoground set (--set num_samples=5 for a smoke run)
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
