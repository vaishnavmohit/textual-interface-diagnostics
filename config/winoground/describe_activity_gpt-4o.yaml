# Stage 1 (perception) for Winoground: GPT-4o describes each image with the
# relation-focused activity schema. Writes the frozen artifact under
# ${OUTPUT_DIR}/descriptions/gpt-4o/activity_v1/winoground/ .
#   python main.py --config config/winoground/describe_activity_gpt-4o.yaml
model:
  module: "pri.describe"
  function: "run"
  parameters:
    dataset: "winoground"
    json_path: "${DATA_DIR}/winoground/winoground.json"
    image_dir: "${DATA_DIR}/winoground/images"
    perception_model: "gpt-4o"
    context: "winoground"
    output_dir: "${OUTPUT_DIR}"
    split_name: "winoground"
    num_samples: 400          # full Winoground set (--set num_samples=5 for a smoke run)
    m: 0
    n: 0
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
    force: false
