# Stage 2 (reasoning) for Winoground: Text/Image/Group scoring over the frozen
# GPT-4o descriptions. Requires the matching describe run first (aborts otherwise).
# Swap the reasoner by copying this file and changing only `reasoner_model`.
#   python main.py --config config/winoground/reason_winoground_gpt-4o.yaml
model:
  module: "pri.winoground"
  function: "run"
  parameters:
    dataset: "winoground"
    json_path: "${DATA_DIR}/winoground/winoground.json"
    reasoner_model: "gpt-4o"
    perception_model: "gpt-4o"       # must match the describe run
    output_dir: "${OUTPUT_DIR}"
    experiment: "winoground"
    split_name: "winoground"
    num_samples: 400                   # full Winoground set (--set num_samples=5 for a smoke run)
    temperature: 0
    max_tokens: 3000
    num_ctx: 8192
    think: false
